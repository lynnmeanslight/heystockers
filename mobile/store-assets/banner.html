<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  .banner {
    width: 1200px; height: 600px; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #1c1c1c 0%, #0a0a0a 62%, #000 100%);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* faint brand bars echoing the H, framing the composition */
  .bar { position: absolute; top: 0; height: 100%; width: 2px; background: #ffffff; opacity: 0.06; }
  .bar.l { left: 300px; } .bar.r { right: 300px; }
  .overline {
    color: #7c8899; font-size: 20px; font-weight: 700;
    letter-spacing: 8px; text-transform: uppercase; margin-bottom: 26px;
  }
  .wordmark {
    color: #ffffff; font-size: 88px; font-weight: 800; letter-spacing: 2px; line-height: 1;
  }
  .rule { width: 56px; height: 3px; background: #ffffff; opacity: 0.28; margin: 30px 0; }
  .tagline { color: #aeb6c2; font-size: 26px; font-weight: 500; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="banner">
    <div class="bar l"></div>
    <div class="bar r"></div>
    <div class="overline">Tokenized stocks on Solana</div>
    <div class="wordmark">HEYSTOCKERS</div>
    <div class="rule"></div>
    <div class="tagline">Buy, sell, and prove your calls onchain.</div>
  </div>
</body>
</html>
